<text x="450" y="332" text-anchor="middle" font-family="Inter, Arial" font-size="24" font-weight="900" fill="#FFFFFF">RAW</text>
<text x="120" y="118" font-family="Inter, Arial" font-size="16" font-weight="800" fill="#0F766E">1 · DISCOVER</text>
<text x="120" y="148" font-family="Inter, Arial" font-size="24" font-weight="900" fill="#0F172A">Find surplus</text>
<text x="120" y="176" font-family="Inter, Arial" font-size="13" fill="#64748B">See what's available nearby.</text>
<text x="610" y="118" font-family="Inter, Arial" font-size="16" font-weight="800" fill="#0F766E">2 · MATCH</text>
<text x="610" y="148" font-family="Inter, Arial" font-size="24" font-weight="900" fill="#0F172A">Rank demand</text>
<text x="610" y="176" font-family="Inter, Arial" font-size="13" fill="#64748B">Need + distance + trust + price.</text>
<text x="130" y="398" font-family="Inter, Arial" font-size="16" font-weight="800" fill="#0F766E">3 · REDISTRIBUTE</text>
<text x="130" y="428" font-family="Inter, Arial" font-size="24" font-weight="900" fill="#0F172A">Keep it moving</text>
<text x="130" y="456" font-family="Inter, Arial" font-size="13" fill="#64748B">Offer, exchange, confirm, repeat.</text>
<text x="610" y="398" font-family="Inter, Arial" font-size="16" font-weight="800" fill="#0F766E">4 · MEASURE</text>
<text x="610" y="428" font-family="Inter, Arial" font-size="24" font-weight="900" fill="#0F172A">Track impact</text>
<text x="610" y="456" font-family="Inter, Arial" font-size="13" fill="#64748B">Value recovered and reuse cycles.</text>
